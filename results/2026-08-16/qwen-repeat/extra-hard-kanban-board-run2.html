<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flowboard</title>
<style>
  :root{
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Segoe UI Mono", Menlo, Consolas, monospace;
    --bg:#e9edf3; --surface:#ffffff; --surface-2:#f4f7fb;
    --ink:#141a24; --ink-soft:#5a6473; --line:#d7dde6;
    --accent:#0f766e; --accent-ink:#ffffff;
    --danger:#dc2626;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 10px 24px -12px rgba(16,24,40,.22);
    --shadow-lg:0 18px 44px -14px rgba(16,24,40,.4);
    --focus:#2563eb;
    --c1:#f59e0b; --c2:#3b82f6; --c3:#10b981;
  }
  [data-theme="dark"]{
    --bg:#0b0f16; --surface:#141b26; --surface-2:#1a2331;
    --ink:#e8edf5; --ink-soft:#8b97a8; --line:#26313f;
    --accent:#2dd4bf; --accent-ink:#04231f;
    --danger:#f87171;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 30px -14px rgba(0,0,0,.6);
    --shadow-lg:0 22px 50px -16px rgba(0,0,0,.75);
    --focus:#60a5fa;
    --c1:#fbbf24; --c2:#60a5fa; --c3:#34d399;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--font-sans); color:var(--ink); background:var(--bg);
    min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
    background:
      radial-gradient(60% 55% at 12% -5%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
      radial-gradient(55% 55% at 100% 0%, color-mix(in srgb, var(--c2) 14%, transparent), transparent 70%),
      radial-gradient(70% 60% at 50% 120%, color-mix(in srgb, var(--c3) 12%, transparent), transparent 70%);
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.5;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:34px 34px;
    -webkit-mask-image:radial-gradient(120% 90% at 50% 0%, #000 40%, transparent 90%);
    mask-image:radial-gradient(120% 90% at 50% 0%, #000 40%, transparent 90%);
  }

  .wrap{max-width:1240px; margin:0 auto; padding:22px clamp(14px,3vw,30px) 40px}

  /* ---------- header ---------- */
  .top{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:18px}
  .brand{display:flex; align-items:center; gap:12px; margin-right:auto}
  .mark{width:44px; height:44px; border-radius:13px; background:var(--surface);
    border:1px solid var(--line); box-shadow:var(--shadow); display:grid; place-items:center; flex:none}
  .mark svg{width:26px; height:26px}
  .brand h1{font-family:var(--font-mono); font-size:22px; letter-spacing:-.02em; margin:0; line-height:1}
  .brand .sub{font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); letter-spacing:.14em; text-transform:uppercase; margin-top:4px}

  .search{position:relative; flex:1 1 220px; min-width:150px; max-width:340px}
  .search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--ink-soft); pointer-events:none}
  .search input{width:100%; padding:10px 34px 10px 34px; border-radius:11px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font:inherit; font-size:14px; transition:border-color .15s, box-shadow .15s}
  .search input::placeholder{color:var(--ink-soft)}
  .search input:focus{outline:none; border-color:var(--focus); box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 30%, transparent)}
  .search .clear{position:absolute; right:6px; top:50%; transform:translateY(-50%); border:none; background:transparent;
    color:var(--ink-soft); cursor:pointer; width:24px; height:24px; border-radius:7px; display:none; place-items:center}
  .search .clear:hover{background:var(--surface-2); color:var(--ink)}
  .search.has .clear{display:grid}

  .tools{display:flex; gap:8px}
  .btn{display:inline-flex; align-items:center; gap:7px; padding:9px 13px; border-radius:11px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
    transition:transform .12s, box-shadow .15s, background .15s, border-color .15s; box-shadow:var(--shadow)}
  .btn svg{width:16px; height:16px}
  .btn:hover{transform:translateY(-1px); box-shadow:var(--shadow-lg)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:var(--shadow)}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.icon{padding:9px}
  .btn:focus-visible{outline:2px solid var(--focus); outline-offset:2px}

  /* ---------- board ---------- */
  .board{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; align-items:start}
  .col{background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; min-height:120px; transition:box-shadow .15s, border-color .15s}
  .col-head{display:flex; align-items:center; gap:9px; padding:14px 15px 12px; border-bottom:1px solid var(--line)}
  .dot{width:11px; height:11px; border-radius:50%; flex:none; box-shadow:0 0 0 4px color-mix(in srgb, currentColor 18%, transparent)}
  .col[data-col="todo"] .dot{color:var(--c1); background:var(--c1)}
  .col[data-col="inprogress"] .dot{color:var(--c2); background:var(--c2)}
  .col[data-col="done"] .dot{color:var(--c3); background:var(--c3)}
  .col-title{font-family:var(--font-mono); font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase}
  .count{margin-left:auto; font-family:var(--font-mono); font-size:12px; font-weight:700; color:var(--ink-soft);
    background:var(--surface-2); border:1px solid var(--line); padding:2px 9px; border-radius:20px; min-width:30px; text-align:center}
  .count.bump{animation:bump .35s ease}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}

  .list{padding:12px; display:flex; flex-direction:column; gap:10px; flex:1; min-height:44px}
  .list.drag-over{background:color-mix(in srgb, var(--focus) 7%, transparent); border-radius:12px}
  .empty{border:1.5px dashed var(--line); border-radius:12px; padding:22px 14px; text-align:center;
    color:var(--ink-soft); font-size:13px; font-family:var(--font-mono)}

  /* ---------- card ---------- */
  .card{position:relative; background:var(--surface-2); border:1px solid var(--line); border-radius:12px;
    padding:12px 13px; cursor:grab; box-shadow:var(--shadow);
    transition:transform .14s, box-shadow .14s, border-color .14s, opacity .14s}
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:color-mix(in srgb, var(--focus) 40%, var(--line))}
  .card:focus{outline:none}
  .card:focus-visible{outline:2px solid var(--focus); outline-offset:2px; box-shadow:0 0 0 5px color-mix(in srgb, var(--focus) 22%, transparent)}
  .card.dragging{opacity:.4; transform:scale(.98); cursor:grabbing}
  .card.selected{border-color:var(--focus); box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 30%, transparent)}
  .card.enter{animation:enter .3s ease}
  @keyframes enter{from{opacity:0; transform:translateY(8px) scale(.98)}to{opacity:1; transform:none}}
  .card-top{display:flex; align-items:center; gap:8px; margin-bottom:7px}
  .grip{color:var(--ink-soft); display:grid; place-items:center; flex:none}
  .grip svg{width:15px; height:15px}
  .tag{font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    padding:2px 8px; border-radius:20px; border:1px solid var(--line); color:var(--ink-soft)}
  .card[data-col="todo"] .tag{color:var(--c1); border-color:color-mix(in srgb, var(--c1) 40%, transparent); background:color-mix(in srgb, var(--c1) 12%, transparent)}
  .card[data-col="inprogress"] .tag{color:var(--c2); border-color:color-mix(in srgb, var(--c2) 40%, transparent); background:color-mix(in srgb, var(--c2) 12%, transparent)}
  .card[data-col="done"] .tag{color:var(--c3); border-color:color-mix(in srgb, var(--c3) 40%, transparent); background:color-mix(in srgb, var(--c3) 12%, transparent)}
  .card-title{font-size:14.5px; line-height:1.4; font-weight:500; word-break:break-word; cursor:text}
  .card-title[contenteditable="true"]{outline:2px solid var(--focus); outline-offset:2px; border-radius:6px; padding:2px 4px; margin:-2px -4px; cursor:text}
  .card-foot{display:flex; align-items:center; gap:6px; margin-top:10px}
  .meta{font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); margin-right:auto}
  .card-actions{display:flex; gap:4px; opacity:0; transform:translateX(4px); transition:opacity .15s, transform .15s}
  .card:hover .card-actions, .card:focus-within .card-actions, .card.selected .card-actions{opacity:1; transform:none}
  .mini{border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); width:28px; height:28px;
    border-radius:8px; display:grid; place-items:center; cursor:pointer; transition:all .12s}
  .mini svg{width:15px; height:15px}
  .mini:hover{color:var(--ink); border-color:var(--focus); transform:translateY(-1px)}
  .mini.del:hover{color:var(--danger); border-color:var(--danger)}
  .mini:focus-visible{outline:2px solid var(--focus); outline-offset:1px}

  /* ---------- drop indicator ---------- */
  .drop-ind{height:4px; border-radius:4px; margin:2px 4px; background:var(--focus);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

  /* ---------- footer / hint ---------- */
  .hint{margin-top:22px; display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center;
    font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft)}
  .hint b{color:var(--ink); font-weight:700}
  kbd{font-family:var(--font-mono); font-size:10.5px; background:var(--surface); border:1px solid var(--line);
    border-bottom-width:2px; border-radius:5px; padding:1px 6px; color:var(--ink)}

  /* ---------- toast ---------- */
  .toast{position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px); z-index:50;
    background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:12px; font-size:13.5px; font-weight:600;
    box-shadow:var(--shadow-lg); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; max-width:90vw}
  .toast.show{opacity:1; transform:translate(-50%,0)}

  /* ---------- responsive ---------- */
  @media (max-width:860px){
    .board{grid-template-columns:1fr}
    .col{min-height:0}
    .search{order:3; flex-basis:100%; max-width:none}
    .brand{margin-right:0}
  }
  @media (max-width:400px){
    .brand h1{font-size:19px}
    .btn{padding:8px 11px; font-size:12.5px}
    .card-actions{opacity:1; transform:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="3" y="4" width="5" height="16" rx="1.5" fill="var(--c1)"/>
            <rect x="9.5" y="4" width="5" height="11" rx="1.5" fill="var(--c2)"/>
            <rect x="16" y="4" width="5" height="7" rx="1.5" fill="var(--c3)"/>
          </svg>
        </div>
        <div>
          <h1>Flowboard</h1>
          <div class="sub">drag · drop · undo</div>
        </div>
      </div>

      <div class="search" id="searchWrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Filter cards…" aria-label="Filter cards" autocomplete="off">
        <button class="clear" id="clearSearch" aria-label="Clear search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="tools">
        <button class="btn" id="undo" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>
          Undo
        </button>
        <button class="btn icon" id="theme" aria-label="Toggle theme">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        </button>
      </div>
    </header>

    <main class="board" id="board" aria-label="Kanban board"></main>

    <footer class="hint">
      <span><b>Drag</b> cards between columns</span>
      <span><kbd>Tab</kbd> select a card</span>
      <span><kbd>←</kbd><kbd>→</kbd> move it</span>
      <span><kbd>Enter</kbd> / double-click to edit</span>
      <span><kbd>Del</kbd> remove</span>
      <span><kbd>Ctrl</kbd>+<kbd>Z</kbd> undo</span>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  const COLUMNS = [
    {id:"todo",       title:"To Do"},
    {id:"inprogress", title:"In Progress"},
    {id:"done",       title:"Done"}
  ];
  const DATA_KEY = "flowboard.data.v1";
  const THEME_KEY = "flowboard.theme.v1";

  const ICONS = {
    grip:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
    edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>',
    sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>',
    moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>'
  };

  const board   = document.getElementById("board");
  const undoBtn = document.getElementById("undo");
  const themeBtn= document.getElementById("theme");
  const themeIcon = document.getElementById("themeIcon");
  const search  = document.getElementById("search");
  const searchWrap = document.getElementById("searchWrap");
  const clearSearch = document.getElementById("clearSearch");
  const toastEl = document.getElementById("toast");

  let state = { cards: [] };
  let history = [];
  let selectedId = null;
  let editingId = null;
  let dragId = null;
  let lastCount = {};
  let toastTimer;

  /* ---------- helpers ---------- */
  const uid = () => "c" + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
  const clone = o => JSON.parse(JSON.stringify(o));
  const colIndex = id => COLUMNS.findIndex(c => c.id === id);
  const colTitle = id => (COLUMNS.find(c => c.id === id) || {}).title || id;

  function seed(){
    const now = Date.now();
    return [
      {id:uid(), title:"Draft the Q3 product roadmap", col:"todo",       created:now-1000},
      {id:uid(), title:"Fix the flaky checkout test",   col:"todo",       created:now-900},
      {id:uid(), title:"Design the onboarding flow",    col:"inprogress", created:now-800},
      {id:uid(), title:"Refactor the auth middleware",  col:"inprogress", created:now-700},
      {id:uid(), title:"Ship dark mode to the web app", col:"done",       created:now-600},
      {id:uid(), title:"Write API docs for v2",         col:"done",       created:now-500}
    ];
  }

  function load(){
    try{
      const raw = localStorage.getItem(DATA_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.cards)){
          state.cards = parsed.cards.filter(c => c && c.id && c.title && colIndex(c.col) >= 0);
          return;
        }
      }
    }catch(e){}
    state.cards = seed();
    save();
  }
  function save(){ try{ localStorage.setItem(DATA_KEY, JSON.stringify(state)); }catch(e){} }

  function loadTheme(){
    let t = null;
    try{ t = localStorage.getItem(THEME_KEY); }catch(e){}
    if(t !== "light" && t !== "dark"){
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    applyTheme(t);
  }
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    themeIcon.innerHTML = t === "dark" ? ICONS.sun : ICONS.moon;
    themeBtn.setAttribute("aria-label", t === "dark" ? "Switch to light theme" : "Switch to dark theme");
  }

  /* ---------- history / undo ---------- */
  function pushHistory(action){
    history.push({action, before:clone(state.cards), after:clone(state.cards)});
    if(history.length > 60) history.shift();
    undoBtn.disabled = history.length === 0;
  }
  function undo(){
    const h = history.pop();
    if(!h) return;
    state.cards = clone(h.before);
    save();
    undoBtn.disabled = history.length === 0;
    render();
    toast("Undid: " + h.action);
  }

  /* ---------- card operations ---------- */
  function addCard(title, col){
    const card = {id:uid(), title:title.trim(), col:col, created:Date.now()};
    state.cards.push(card);
    pushHistory("add card");
    save(); render();
    return card.id;
  }
  function moveCard(id, toCol, toIndex){
    const from = state.cards.findIndex(c => c.id === id);
    if(from < 0) return;
    const card = state.cards.splice(from,1)[0];
    card.col = toCol;
    if(toIndex == null) toIndex = state.cards.length;
    toIndex = Math.max(0, Math.min(toIndex, state.cards.length));
    state.cards.splice(toIndex, 0, card);
    pushHistory("move card");
    save(); render();
  }
  function editCard(id, title){
    const c = state.cards.find(x => x.id === id);
    if(!c) return;
    const t = title.trim();
    if(!t){ render(); return; }
    if(t === c.title){ render(); return; }
    c.title = t;
    pushHistory("edit card");
    save(); render();
  }
  function deleteCard(id){
    const i = state.cards.findIndex(c => c.id === id);
    if(i < 0) return;
    state.cards.splice(i,1);
    pushHistory("delete card");
    save(); render();
  }

  /* ---------- rendering ---------- */
  function render(){
    const q = search.value.trim().toLowerCase();
    board.innerHTML = "";
    COLUMNS.forEach(col => {
      const cards = state.cards.filter(c => c.col === col.id);
      const visible = q ? cards.filter(c => c.title.toLowerCase().includes(q)) : cards;

      const section = document.createElement("section");
      section.className = "col";
      section.dataset.col = col.id;
      section.setAttribute("aria-label", col.title + " column");

      const head = document.createElement("div");
      head.className = "col-head";
      head.innerHTML =
        '<span class="dot" aria-hidden="true"></span>' +
        '<span class="col-title">' + col.title + '</span>' +
        '<span class="count" data-count>' + visible.length + '</span>';
      section.appendChild(head);

      const list = document.createElement("div");
      list.className = "list";
      list.dataset.col = col.id;

      if(visible.length === 0){
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = q ? "No matches" : "Drop cards here";
        list.appendChild(empty);
      } else {
        visible.forEach(c => list.appendChild(buildCard(c)));
      }
      section.appendChild(list);
      board.appendChild(section);
    });

    // animate count changes
    COLUMNS.forEach(col => {
      const el = board.querySelector('.col[data-col="'+col.id+'"] [data-count]');
      const n = parseInt(el.textContent,10);
      if(lastCount[col.id] !== undefined && lastCount[col.id] !== n){
        el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
      }
      lastCount[col.id] = n;
    });

    // restore selection / editing focus
    if(selectedId){
      const el = board.querySelector('.card[data-id="'+selectedId+'"]');
      if(el){ el.classList.add("selected"); }
    }
    if(editingId){
      const el = board.querySelector('.card[data-id="'+editingId+'"] .card-title');
      if(el){ el.focus(); const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
    }
  }

  function buildCard(c){
    const el = document.createElement("article");
    el.className = "card" + (c.id === selectedId ? " selected" : "");
    el.dataset.id = c.id;
    el.dataset.col = c.col;
    el.setAttribute("draggable", "true");
    el.tabIndex = 0;
    el.setAttribute("role", "button");
    el.setAttribute("aria-label", c.title + ", " + colTitle(c.col) + " column. Press arrow keys to move, Enter to edit, Delete to remove.");

    const top = document.createElement("div");
    top.className = "card-top";
    top.innerHTML =
      '<span class="grip" aria-hidden="true">' + ICONS.grip + '</span>' +
      '<span class="tag">' + colTitle(c.col) + '</span>';

    const title = document.createElement("div");
    title.className = "card-title";
    title.textContent = c.title;
    title.title = "Double-click to edit";

    const foot = document.createElement("div");
    foot.className = "card-foot";
    foot.innerHTML =
      '<span class="meta">#' + c.id.slice(1,6) + '</span>' +
      '<span class="card-actions">' +
        '<button class="mini" data-act="edit" aria-label="Edit card">' + ICONS.edit + '</button>' +
        '<button class="mini del" data-act="delete" aria-label="Delete card">' + ICONS.del + '</button>' +
      '</span>';

    el.appendChild(top);
    el.appendChild(title);
    el.appendChild(foot);

    // drag
    el.addEventListener("dragstart", e => {
      dragId = c.id;
      el.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      try{ e.dataTransfer.setData("text/plain", c.id); }catch(_){}
    });
    el.addEventListener("dragend", () => {
      el.classList.remove("dragging");
      dragId = null;
      clearIndicator();
    });

    // keyboard
    el.addEventListener("keydown", e => onCardKey(e, c.id));

    // double-click to edit
    title.addEventListener("dblclick", () => startEdit(c.id));

    // buttons
    foot.addEventListener("click", e => {
      const b = e.target.closest("button[data-act]");
      if(!b) return;
      e.stopPropagation();
      if(b.dataset.act === "edit") startEdit(c.id);
      else if(b.dataset.act === "delete") deleteCard(c.id);
    });

    return el;
  }

  /* ---------- keyboard on cards ---------- */
  function onCardKey(e, id){
    if(editingId === id) return; // editing handled by input
    switch(e.key){
      case "ArrowLeft":
        e.preventDefault();
        moveStep(id, -1);
        break;
      case "ArrowRight":
        e.preventDefault();
        moveStep(id, 1);
        break;
      case "Enter":
      case " ":
        e.preventDefault();
        startEdit(id);
        break;
      case "Delete":
      case "Backspace":
        e.preventDefault();
        deleteCard(id);
        break;
      case "Escape":
        e.preventDefault();
        clearSelection();
        break;
    }
  }

  function moveStep(id, dir){
    const c = state.cards.find(x => x.id === id);
    if(!c) return;
    const ci = colIndex(c.col);
    const next = ci + dir;
    if(next < 0 || next >= COLUMNS.length) return;
    const target = COLUMNS[next].id;
    const idx = state.cards.findIndex(x => x.col === target);
    moveCard(id, target, idx === -1 ? null : idx);
    focusCard(id);
  }

  function focusCard(id){
    const el = board.querySelector('.card[data-id="'+id+'"]');
    if(el) el.focus();
  }
  function clearSelection(){
    selectedId = null;
    board.querySelectorAll(".card.selected").forEach(el => el.classList.remove("selected"));
  }

  /* ---------- editing ---------- */
  function startEdit(id){
    const c = state.cards.find(x => x.id === id);
    if(!c) return;
    editingId = id;
    const el = board.querySelector('.card[data-id="'+id+'"] .card-title');
    if(!el) return;
    el.setAttribute("contenteditable", "true");
    el.setAttribute("role", "textbox");
    el.focus();
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = getSelection();
    sel.removeAllRanges(); sel.addRange(range);

    const finish = (commit) => {
      const val = el.textContent;
      el.removeAttribute("contenteditable");
      el.removeAttribute("role");
      editingId = null;
      if(commit) editCard(id, val);
      else { el.textContent = c.title; render(); }
      focusCard(id);
    };
    el.onkeydown = e => {
      if(e.key === "Enter"){ e.preventDefault(); finish(true); }
      else if(e.key === "Escape"){ e.preventDefault(); finish(false); }
    };
    el.onblur = () => finish(true);
  }

  /* ---------- drop indicator ---------- */
  function clearIndicator(){
    board.querySelectorAll(".drop-ind").forEach(n => n.remove());
    board.querySelectorAll(".list.drag-over").forEach(n => n.classList.remove("drag-over"));
  }
  function getAfter(list, y){
    const els = [...list.querySelectorAll(".card:not(.dragging)")];
    let after = null;
    for(const el of els){
      const box = el.getBoundingClientRect();
      if(y < box.top + box.height/2){ after = el; break; }
    }
    return after;
  }
  function showIndicator(list, afterEl){
    clearIndicator();
    const ind = document.createElement("div");
    ind.className = "drop-ind";
    if(afterEl) list.insertBefore(ind, afterEl);
    else list.appendChild(ind);
    list.classList.add("drag-over");
  }

  /* ---------- toast ---------- */
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
  }

  /* ---------- wire up board (delegated) ---------- */
  board.addEventListener("click", e => {
    const card = e.target.closest(".card");
    if(!card) return;
    if(e.target.closest("button")) return;
    selectedId = card.dataset.id;
    board.querySelectorAll(".card.selected").forEach(el => el.classList.remove("selected"));
    card.classList.add("selected");
  });

  board.addEventListener("dragover", e => {
    const list = e.target.closest(".list");
    if(!list || !dragId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    const after = getAfter(list, e.clientY);
    showIndicator(list, after);
  });
  board.addEventListener("dragleave", e => {
    const list = e.target.closest(".list");
    if(list && !list.contains(e.relatedTarget)){
      clearIndicator();
    }
  });
  board.addEventListener("drop", e => {
    const list = e.target.closest(".list");
    if(!list || !dragId) return;
    e.preventDefault();
    const after = getAfter(list, e.clientY);
    const afterCard = after ? after.dataset.id : null;
    const targetCol = list.dataset.col;
    let toIndex;
    if(afterCard){
      toIndex = state.cards.findIndex(c => c.id === afterCard);
    } else {
      toIndex = state.cards.filter(c => c.col === targetCol).length;
    }
    clearIndicator();
    moveCard(dragId, targetCol, toIndex);
    dragId = null;
  });

  /* ---------- global keys ---------- */
  document.addEventListener("keydown", e => {
    const editing = document.activeElement && document.activeElement.isContentEditable;
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z"){
      e.preventDefault();
      undo();
      return;
    }
    if(editing) return;
    if(e.key === "Escape"){
      if(document.activeElement === search){ search.value=""; searchWrap.classList.remove("has"); render(); }
      else clearSelection();
    }
  });

  /* ---------- controls ---------- */
  undoBtn.addEventListener("click", undo);

  themeBtn.addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  });

  search.addEventListener("input", () => {
    searchWrap.classList.toggle("has", search.value.length > 0);
    render();
  });
  clearSearch.addEventListener("click", () => {
    search.value = "";
    searchWrap.classList.remove("has");
    render();
    search.focus();
  });

  /* ---------- init ---------- */
  loadTheme();
  load();
  render();
})();
</script>
</body>
</html>
